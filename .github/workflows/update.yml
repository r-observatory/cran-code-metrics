name: Update CRAN Code Metrics

on:
  schedule:
    # Three times a day rather than once. A version released after the run is
    # invisible on the site until the next one, and the site merges once a day,
    # so a mid-afternoon release waited a full extra day: writexl 2.0.0 landed at
    # 13:50 UTC, hours after that day's only run. Runs are incremental and this
    # repo is public, so the added cost is not billed: a typical run analyses one
    # changed package in 0s and the wall clock is almost entirely moving the
    # database. The last run is before the merge's earliest hour, so the day's
    # releases are picked up the same day.
    - cron: "0 4,10,16 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Re-analyze every package from scratch, ignoring the prior database."
        type: boolean
        default: false
      recollect:
        description: "Backfill packages whose rows predate the binary metrics, in place (no wipe)."
        type: boolean
        default: false
      time_budget_seconds:
        description: "Stop starting new shards after this many seconds (default 18000 = 5h)."
        default: "18000"
      harvest_descriptions:
        description: "Backfill archived-package title/description from their tarball DESCRIPTIONs (heavy, one-time; idempotent/resumable)."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cran-code-metrics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::digest
            any::testthat
            any::withr

      - name: Install rpkg-analyzer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download v0.2.0 --repo r-observatory/rpkg-analyzer \
            --pattern 'rpkg-analyzer-linux-x86_64.tar.gz' --dir /tmp
          tar -xzf /tmp/rpkg-analyzer-linux-x86_64.tar.gz -C "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rpkg-analyzer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "RPKG_ANALYZER_BIN=$HOME/.local/bin/rpkg-analyzer" >> "$GITHUB_ENV"
          "$HOME/.local/bin/rpkg-analyzer" --sexp <(echo 'x <- 1') >/dev/null && echo "rpkg-analyzer ready"

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Download the latest databases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out
          latest_tag() { gh release list --limit 1000 --json tagName -q '.[].tagName' | { grep "^$1-" || true; } | sort -r | head -1; }

          # A single consolidated release per day (metrics-YYYY-MM-DD) carries both
          # the code and data DBs as assets. Fall back to the legacy split code-/data-
          # tags on the first run after the consolidation so the in-flight bootstrap
          # (the prior code DB) is not lost.
          METRICS_TAG=$(latest_tag metrics)
          CODE_SRC="${METRICS_TAG:-$(latest_tag code)}"
          DATA_SRC="${METRICS_TAG:-$(latest_tag data)}"
          echo "prior metrics tag: ${METRICS_TAG:-none}; code src: ${CODE_SRC:-none}; data src: ${DATA_SRC:-none}"

          # This pipeline is incremental: the prior release's database IS the
          # accumulated state, and a run that starts without it rebuilds from
          # empty and publishes that as latest, green. cran-queue lost 323,063
          # snapshots covering four months exactly that way on 2026-07-16, when
          # a single 503 on the asset download was swallowed by `|| true`. So
          # every fetch below retries, a zero-length file counts as a failed
          # download, and a release that advertises an asset we cannot get
          # fails the run. "No prior release" stays distinguishable from "the
          # download failed" because it is the resolved tag, not the presence
          # of a file, that says which one we are in, and a cold start (empty
          # tag) still works.
          list_assets() {
            local tag="$1" dest="$2" n
            for n in 1 2 3 4 5; do
              if gh release view "$tag" --json assets -q '.assets[].name' > "$dest"; then
                return 0
              fi
              echo "attempt ${n}: could not list the assets of ${tag}"
              if [ "$n" -lt 5 ]; then sleep $((n * 10)); fi
            done
            return 1
          }

          have_asset() { grep -qxF "$2" "out/.assets-$1"; }

          get_asset() {
            local tag="$1" name="$2" n
            for n in 1 2 3 4 5; do
              rm -f "out/$name"
              if gh release download "$tag" --pattern "$name" --dir out && [ -s "out/$name" ]; then
                echo "fetched ${name} from ${tag} ($(stat -c%s "out/$name") bytes)"
                return 0
              fi
              echo "attempt ${n}: ${name} did not arrive from ${tag}, or arrived empty"
              if [ "$n" -lt 5 ]; then sleep $((n * 10)); fi
            done
            echo "::error::${tag} lists ${name} as an asset but five attempts failed to fetch a non-empty copy. Refusing to continue: this run would rebuild from an empty database and publish it as latest."
            exit 1
          }

          if [ -n "$CODE_SRC" ]; then
            if ! list_assets "$CODE_SRC" "out/.assets-${CODE_SRC}"; then
              echo "::error::could not read the asset list of ${CODE_SRC}; refusing to guess whether it carries a database."
              exit 1
            fi
            if have_asset "$CODE_SRC" cran-code-metrics.db; then
              get_asset "$CODE_SRC" cran-code-metrics.db
            fi
            # code-manifest.json only. The pre-split manifest.json still
            # attached to the `current` release cannot serve as a baseline: it
            # has no series and no n_packages, and its n_versions is
            # nrow(fresh_summary), one shard's row count rather than a database
            # total, so preflight.R rejects it on sight. A tag whose manifest
            # is missing or unusable gets its baseline measured from the
            # database that did come back instead.
            if have_asset "$CODE_SRC" code-manifest.json; then
              get_asset "$CODE_SRC" code-manifest.json
              mv out/code-manifest.json out/prev-code-manifest.json
            fi
          fi
          if [ -n "$DATA_SRC" ]; then
            if [ "$DATA_SRC" != "$CODE_SRC" ] && ! list_assets "$DATA_SRC" "out/.assets-${DATA_SRC}"; then
              echo "::error::could not read the asset list of ${DATA_SRC}; refusing to guess whether it carries a database."
              exit 1
            fi
            if have_asset "$DATA_SRC" cran-data-metrics.db; then
              get_asset "$DATA_SRC" cran-data-metrics.db
            fi
            if have_asset "$DATA_SRC" data-manifest.json; then
              get_asset "$DATA_SRC" data-manifest.json
              mv out/data-manifest.json out/prev-data-manifest.json
            fi
          fi

          # A download can succeed and still hand back a truncated file, so
          # check each database against the manifest published with it before
          # any shard writes to it. Rows, not bytes: a --harvest-descriptions
          # run clobbers the database asset and leaves the published manifest
          # stale, which moves the file size but never touches
          # cran_code_summary. This is also where a release that published a
          # database and no manifest gets a baseline measured from that
          # database, so an interrupted upload costs a warning rather than
          # every run from here on.
          Rscript scripts/preflight.R out/

          # Snapshot the pre-run package set so the release notes can tag
          # each changed package as new-to-the-catalog vs updated. Always
          # write the file (empty when there is no prior code DB) so the
          # renderer never has to special-case its absence.
          sqlite3 out/cran-code-metrics.db "SELECT DISTINCT package FROM cran_code_summary" > out/seed-packages.txt 2>/dev/null || : > out/seed-packages.txt

          echo "PREV_CODE_TAG=${CODE_SRC}" >> "$GITHUB_ENV"
          echo "PREV_DATA_TAG=${DATA_SRC}" >> "$GITHUB_ENV"
          ls -la out || true

      - name: Analyze shards and publish after each
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_TITLE_PREFIX: CRAN
          # --bootstrap goes to the first shard only (a second one would wipe
          # what the first just collected), so the retention guard cannot key
          # its exemption on the flag or it would refuse shard 2 of the
          # operator's own rebuild. The dispatch input covers the whole step.
          FORCE_FULL_REBUILD: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          TODAY="$(date -u +%Y-%m-%d)"
          METRICS_TAG="metrics-${TODAY}"

          # Harvest mode: backfill archived title/description from tarball
          # DESCRIPTIONs. It only mutates cran_archived_meta's title/description
          # (the code metrics + data DB + manifests are untouched), so we clobber
          # just the code-DB asset in today's release. Idempotent (title-IS-NULL
          # selection) and resumable, so a re-run continues where it left off.
          if [ "${{ inputs.harvest_descriptions }}" = "true" ]; then
            echo "=== harvest-descriptions (elapsed ${SECONDS}s) ==="
            Rscript scripts/update.R out/ --harvest-descriptions
            if gh release view "$METRICS_TAG" >/dev/null 2>&1; then
              gh release upload "$METRICS_TAG" out/cran-code-metrics.db --clobber
              echo "clobbered cran-code-metrics.db in ${METRICS_TAG}"
            else
              echo "::error::no ${METRICS_TAG} release to update; run the normal update first."
              exit 1
            fi
            exit 0
          fi

          BUDGET="${{ inputs.time_budget_seconds || '18000' }}"
          FORCE=""; [ "${{ inputs.force_full }}" = "true" ] && FORCE="--bootstrap"
          RECOLLECT=""; [ "${{ inputs.recollect }}" = "true" ] && RECOLLECT="--recollect"
          TODAY="$(date -u +%Y-%m-%d)"
          METRICS_TAG="metrics-${TODAY}"
          MAX_BYTES=2040109465

          # Publish ONE dated release carrying both the code and data metrics DBs
          # (plus both manifests) as assets, with a single notes body. render_notes.R
          # writes the same catalog to release-notes-code.md/-data.md, so either is
          # the combined body; we attach the code one.
          #
          # Size is the only refusal made here. The refusal that matters more,
          # a run whose figures fell below what the previous release published,
          # is made in scripts/update.R (see "Retention guard"), which exits
          # non-zero and therefore stops the shard below before it ever reaches
          # this function.
          publish_metrics() {
            local f bytes
            for f in cran-code-metrics.db cran-data-metrics.db; do
              bytes=$(stat -c%s "out/$f")
              if [ "$bytes" -gt "$MAX_BYTES" ]; then
                echo "::error::out/$f is ${bytes} bytes (> ${MAX_BYTES}); refusing to publish ${METRICS_TAG}."
                return 1
              fi
            done
            local assets=(out/cran-code-metrics.db out/cran-data-metrics.db out/code-manifest.json out/data-manifest.json)
            if gh release view "$METRICS_TAG" >/dev/null 2>&1; then
              # Today's release already exists (an earlier shard this run): clobber ONLY today.
              gh release upload "$METRICS_TAG" "${assets[@]}" --clobber
              gh release edit "$METRICS_TAG" --notes-file out/release-notes-code.md
            else
              gh release create "$METRICS_TAG" "${assets[@]}" \
                --title "CRAN Metrics - ${TODAY}" --notes-file out/release-notes-code.md --latest
            fi
          }

          shard=0
          while :; do
            shard=$((shard + 1))
            echo "=== shard ${shard} (elapsed ${SECONDS}s) ==="
            Rscript scripts/update.R out/ ${FORCE} ${RECOLLECT}
            FORCE=""

            CHANGED=$(jq -r '.changed' out/run-status.json)
            COMPLETE=$(jq -r '.bootstrap_complete' out/run-status.json)
            echo "shard ${shard}: changed=${CHANGED} complete=${COMPLETE} analyzed=$(jq -r .n_analyzed out/run-status.json)/$(jq -r .n_universe out/run-status.json)"

            if [ "$CHANGED" = "true" ]; then
              Rscript scripts/render_notes.R out/
              publish_metrics || exit 1
            fi

            if [ "$COMPLETE" = "true" ] || [ "$CHANGED" != "true" ]; then
              echo "Nothing left to do (complete=${COMPLETE}, changed=${CHANGED})."
              break
            fi
            [ "$SECONDS" -ge "$BUDGET" ] && { echo "Time budget reached."; break; }
          done

      - name: Prune old dated releases
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: "30"
        run: |
          set -euo pipefail
          # Prune only the consolidated metrics- series. Legacy code-/data- releases
          # are left untouched here and removed by a one-time cleanup once the new
          # scheme is confirmed.
          gh release list --limit 1000 --json tagName -q '.[].tagName' \
            | { grep "^metrics-" || true; } \
            | Rscript scripts/prune.R \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "pruning $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              done
